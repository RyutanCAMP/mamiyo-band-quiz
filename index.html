り聴く時間","思いきり声を出す瞬間","演奏の細かな工夫","音に合わせて体を揺らすこと","みんなで盛り上がること"],["新しいことを始めるとき、大切にしたいのは？","自分の気持ち","最初の一歩を踏み出す勇気","自分らしいやり方","一緒に頑張れる仲間","少しずつ続けること"],["ライブの帰り道、どんな気持ちになりたい？","心が温かくなる","明日も頑張ろうと思える","新しい発見がある","安心して満たされる","またみんなに会いたくなる"]];const ms=[["マミヨ","想いを歌に変えるタイプ","言葉にならない気持ちにも、ちゃんと意味がある。あなたは自分や誰かの想いを大切にする人。胸に残る一節のように、あなたの言葉も誰かの力になるかもしれない。"],["RamBaar","熱を言葉に乗せるタイプ","心が動いたら、立ち止まっていられない。あなたの魅力は、その熱を行動に変える力。あなたが踏み出す一歩が、誰かの勇気に火をつけるかもしれない。"],["惺光 玖拾玖","自分の音を信じるタイプ","みんなと同じじゃなくていい。あなたには、あなたにしか出せない音がある。自分の感性を信じて進む姿は、きっと誰かの心にも響いている。"],["恭世","音と心をつなぐタイプ","目立つ瞬間だけが、すべてじゃない。誰かの気持ちに寄り添い、仲間の音を受け止める。そんなあなたがいるから、生まれる一体感がある。"],["村上良之","夢を現実にするタイプ","ひとりの夢を、みんなの景色に変えていく。あなたは想いを形にすることを大切にする人。次のステージを作る力は、きっとあなたの中にもある。"]];const memberImages=["https://mamiyoband.com/%E7%B4%A0%E6%9D%90/%E5%86%99%E7%9C%9F%E7%B4%A0%E6%9D%90/%E3%83%92%E3%83%BC%E3%83%AD%E3%83%BC/%E3%83%9E%E3%83%9F%E3%83%A8/%E3%82%A2%E3%82%BB%E3%83%83%E3%83%88%2010@4x.png","https://mamiyoband.com/%E7%B4%A0%E6%9D%90/%E5%86%99%E7%9C%9F%E7%B4%A0%E6%9D%90/%E3%83%92%E3%83%BC%E3%83%AD%E3%83%BC/RamBaar/%E3%82%A2%E3%82%BB%E3%83%83%E3%83%88%2014@4x.png","https://mamiyoband.com/%E7%B4%A0%E6%9D%90/%E5%86%99%E7%9C%9F%E7%B4%A0%E6%9D%90/%E3%83%92%E3%83%BC%E3%83%AD%E3%83%BC/%E3%81%A4%E3%81%8F%E3%82%82/%E3%82%A2%E3%82%BB%E3%83%83%E3%83%88%2011@4x.png","https://mamiyoband.com/%E7%B4%A0%E6%9D%90/%E5%86%99%E7%9C%9F%E7%B4%A0%E6%9D%90/%E3%83%92%E3%83%BC%E3%83%AD%E3%83%BC/%E3%82%84%E3%81%99%E3%82%88/%E3%82%A2%E3%82%BB%E3%83%83%E3%83%88%205@4x.png","https://mamiyoband.com/%E7%B4%A0%E6%9D%90/%E5%86%99%E7%9C%9F%E7%B4%A0%E6%9D%90/%E3%83%92%E3%83%BC%E3%83%AD%E3%83%BC/%E6%9D%91%E4%B8%8A/%E3%82%A2%E3%82%BB%E3%83%83%E3%83%88%202@4x.png"];let pos=0,ans=[],order=[0,1,2,3,4];function shuffle(){order=[0,1,2,3,4];for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}}const e=id=>document.getElementById(id);function screen(id){["intro","quiz","result"].forEach(x=>e(x).classList.toggle("hidden",x!==id) ick=()=>{const msg="私はマミヨバンドの「"+m[0]+"」タイプ！\n"+m[1]+"\nあなたも診断してみて！\n"+location.origin+location.pathname;location.href="https://line.me/R/msg/text/?"+encodeURIComponent(msg)};screen("result")}e("start").addEventListener("click",()=>{pos=0;ans=[];shuffle();render()});e("back").addEventListener("click",()=>{if(pos){pos--;render()}});e("again").addEventListener("click",()=>{pos=0;ans=[];shuffle();screen("intro")})})();</script></body></html>
