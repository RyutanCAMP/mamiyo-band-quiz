<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090710"><title>マミヨバンド｜あなたは誰タイプ？</title><meta property="og:title" content="マミヨバンド｜あなたは誰タイプ？"><meta property="og:description" content="5つの質問で、あなたの心に響くメンバータイプを診断。"><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 90% 10%,#53134c,transparent 50%),radial-gradient(ellipse at 5% 90%,#063b55,transparent 55%),#090710;color:white;font-family:system-ui,-apple-system,sans-serif}main{max-width:540px;min-height:100dvh;margin:auto;padding:24px 20px 45px}header{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:900;letter-spacing:.15em;color:#ff8fbd;border-bottom:2px solid #f63e8e;padding-bottom:20px}h1{font-size:clamp(42px,11vw,65px);line-height:1.13;margin:34px 0 20px;font-weight:950;letter-spacing:-.06em}em{font-style:normal;color:#ff4e99;text-shadow:0 0 30px #f6368b88}.lead{font-size:15px;color:#e2d7e4;line-height:1.9}.stage{margin:28px 0;height:185px;border:1px solid #ffffff44;border-radius:22px;background:linear-gradient(120deg,#fa348b33,transparent 50%,#3fc5ff44),repeating-linear-gradient(105deg,transparent 0 32px,#ffffff09 33px 34px),#110e20;display:grid;place-items:center;text-align:center;font-weight:950;letter-spacing:.16em;font-size:24px;text-shadow:0 0 25px #ff439a}.panel{border:1px solid #ffffff35;border-radius:22px;padding:24px 20px;background:#ffffff0d}.tag{display:inline-block;color:#ff9dc5;border:1px solid #ff9dc577;border-radius:30px;padding:7px 12px;font-size:11px;font-weight:800}.btn{display:block;width:100%;border:0;border-radius:40px;padding:18px;margin-top:18px;background:linear-gradient(105deg,#ff3b8d,#9b39df);color:white;font-size:17px;font-weight:900;cursor:pointer;box-shadow:0 10px 35px #f23a8855}.btn.alt{background:#ffffff1d;box-shadow:none;border:1px solid #ffffff44}.choice{display:block;width:100%;margin:11px 0;padding:18px;text-align:left;border-radius:15px;background:#ffffff13;border:1px solid #ffffff38;color:white;font:inherit;font-size:15px;line-height:1.5;cursor:pointer}.choice:focus-visible,.choice:active{border-color:#ff4e99;background:#ff4e9928}.hidden{display:none}h2{font-size:25px;line-height:1.55;margin:20px 0}.progress{height:5px;border-radius:10px;background:#ffffff30;margin:18px 0 28px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#ff3b8d,#35c7ff)}.minor{color:#ff8fbd;font-size:12px;letter-spacing:.15em;font-weight:900}.back{background:transparent;color:#cbbdcc;border:0;padding:18px 0;font-size:14px}.name{font-size:clamp(38px,10vw,58px);font-weight:950;color:#ff6ba9;margin:14px 0;text-shadow:0 0 25px #ff3b8d66}.type{font-size:21px;font-weight:850}.note{font-size:12px;color:#c2b5c6;line-height:1.8}.foot{text-align:center;margin-top:40px;font-size:10px;letter-spacing:.07em;color:#a99bab}</style></head><body><main><header><span>MAMIYO BAND</span><span>FAN DIAGNOSIS</span></header><section id="intro"><div class="minor" style="margin-top:28px">WHO'S YOUR BAND SOUL?</div><h1>あなたは<br><em>誰タイプ？</em></h1><p class="lead">あの日のライブで、心が震えた。<br>あなたの中に響くのは、5人の誰の音？</p><div class="stage">FIVE SOULS<br>ONE SOUND.</div><div class="panel"><span class="tag">全5問・約1分</span><p class="lead">正解はない。心が動く答えを選んで。</p><button class="btn" id="start">診断スタート →</button></div></section><section id="quiz" class="hidden"><div class="minor" id="number" style="margin-top:30px"></div><div class="progress"><div id="bar"></div></div><h2 id="question"></h2><div id="options"></div><button class="back" id="back">← 前の質問に戻る</button></section><section id="result" class="hidden"><div class="minor" style="margin-top:35px">YOUR BAND SOUL IS...</div><div class="panel" style="margin-top:25px"><span class="tag">診断結果</span><div class="name" id="name"></div><div class="type" id="type"></div><p class="lead" id="description"></p><p class="note">この診断はファン向けの創作コンテンツです。メンバー本人の性格を断定するものではありません。</p></div><button class="btn" id="share">LINEで結果をシェア</button><button class="btn alt" id="again">もう一度診断</button></section><div class="foot">FAN-MADE REVIEW EDITION<br>公式ロゴ・写真は確認後に追加予定</div></main><script>(function(){"use strict";const qs=[["ライブが終わっても、心に残り続けるのは？","胸に刺さった歌詞","会場の空気を変えた言葉","思わず聴き入ったギターの音","体を揺らした低音の響き","5人の音がひとつになった瞬間"],["仲間が夢を諦めそうになったら？","その気持ちをじっくり聞く","『まだいける！』と背中を押す","違う道を一緒に探す","隣で変わらず支える","次の一歩を具体的に考える"],["あなたがライブに求めるものは？","心が動く物語","熱いエネルギー","唯一無二の表現","音に身を任せる心地よさ","会場全体の一体感"],["新しい挑戦を始めるとき、一番大切なのは？","自分の想いに嘘をつかない","恐れず飛び込む勇気","自分だけのアイデア","信頼できる仲間","最後までやり抜く力"],["あの夜の自分に、ひと言贈るなら？","その涙も大切な宝物","もっと熱く生きていい","自分の音を信じて","ひとりじゃないよ","夢の続きはここからだ"]];const ms=[["マミヨ","想いを歌に変えるタイプ","言葉にならない気持ちにも、ちゃんと意味がある。あなたは自分や誰かの想いを大切にする人。胸に残る一節のように、あなたの言葉も誰かの力になるかもしれない。"],["RamBaar","熱を言葉に乗せるタイプ","心が動いたら、立ち止まっていられない。あなたの魅力は、その熱を行動に変える力。あなたが踏み出す一歩が、誰かの勇気に火をつけるかもしれない。"],["惺光 玖拾玖","自分の音を信じるタイプ","みんなと同じじゃなくていい。あなたには、あなたにしか出せない音がある。自分の感性を信じて進む姿は、きっと誰かの心にも響いている。"],["恭世","音と心をつなぐタイプ","目立つ瞬間だけが、すべてじゃない。誰かの気持ちに寄り添い、仲間の音を受け止める。そんなあなたがいるから、生まれる一体感がある。"],["村上良之","夢を現実にするタイプ","ひとりの夢を、みんなの景色に変えていく。あなたは想いを形にすることを大切にする人。次のステージを作る力は、きっとあなたの中にもある。"]];let pos=0,ans=[];const e=id=>document.getElementById(id);function screen(id){["intro","quiz","result"].forEach(x=>e(x).classList.toggle("hidden",x!==id));window.scrollTo(0,0)}function render(){e("number").textContent="QUESTION "+(pos+1)+" / 5";e("bar").style.width=((pos+1)*20)+"%";e("question").textContent=qs[pos][0];e("options").replaceChildren();qs[pos].slice(1).forEach((v,i)=>{const b=document.createElement("button");b.className="choice";b.textContent=String.fromCharCode(65+i)+".  "+v;b.addEventListener("click",()=>{ans[pos]=i;pos++;if(pos===5)finish();else render()});e("options").appendChild(b)});e("back").style.visibility=pos?"visible":"hidden";screen("quiz")}function finish(){const scores=[0,0,0,0,0];ans.forEach(i=>scores[i]++);const max=Math.max(...scores);const tied=scores.map((v,i)=>v===max?i:-1).filter(i=>i>=0);const chosen=tied[(ans.reduce((a,b)=>a+b,0)+ans[4])%tied.length];const m=ms[chosen];e("name").textContent=m[0];e("type").textContent=m[1];e("description").textContent=m[2];e("share").onclick=()=>{const msg="私はマミヨバンドの「"+m[0]+"」タイプ！\n"+m[1]+"\nあなたも診断してみて！\n"+location.origin+location.pathname;location.href="https://line.me/R/msg/text/?"+encodeURIComponent(msg)};screen("result")}e("start").addEventListener("click",()=>{pos=0;ans=[];render()});e("back").addEventListener("click",()=>{if(pos){pos--;render()}});e("again").addEventListener("click",()=>{pos=0;ans=[];screen("intro")})})();</script></body></html>
